pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Toolchain Resolver plugin: https://github.com/gradle/foojay-toolchains
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "0.7.0"
}

rootProject.name = repositoryProjectName

// ------------------------------------------------------------- //
// Add "to be included" modules names in gradle.properties file! //
// ------------------------------------------------------------- //

final String moduleNameSeparator = ','
for (moduleName in moduleNames.split(moduleNameSeparator)) {
    //println(moduleName)
    include ":${moduleName.trim()}"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}